version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./app:/var/www/html
    depends_on:
      - php

  php:
    build: ./php
    volumes:
      - ./app:/var/www/html
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pexeso
      DB_USER: pexeso
      DB_PASS: pexeso

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pexeso
      POSTGRES_USER: pexeso
      POSTGRES_PASSWORD: pexeso
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
